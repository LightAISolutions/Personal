/*
 * A generic Telegram Mini App shell for a helper built on the helpers framework (helpers/SPEC.md §6, "Registered
 * routes"). It carries no data, no key and no helper-specific text: the core named by ?core= serves everything after
 * verifying Telegram's signed launch data. Editorial-journal tone: a serif voice for headings, a quiet mono for facts,
 * the chat's own theme colours for everything else so the app reads as part of the conversation it came from.
 */
    :root {
      --bg: #ffffff; --fg: #1a1a1a; --hint: #6f6f6f; --link: #2a6fb0; --btn: #2a6fb0; --btn-fg: #ffffff;
      --card: #f4f3ef; --section: #ffffff; --accent: #2a6fb0; --danger: #c0392b; --line: rgba(0,0,0,0.09);
      --want: #2e7d32; --later: #b26a00; --skip: #8e8e8e; --vh: 100vh;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    body { font: 16px/1.45 var(--sans); min-height: var(--vh); overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--link); }
    .hidden { display: none !important; }

    /* ── chrome ── */
    header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-top: var(--safe-top, 0px); }
    .masthead { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px 6px; }
    .masthead h1 { margin: 0; font: 600 22px/1.1 var(--serif); letter-spacing: -0.01em; }
    .masthead .kicker { font: 11px/1 var(--mono); color: var(--hint); letter-spacing: 0.08em; text-transform: uppercase; }
    .masthead .side { display: flex; align-items: center; gap: 10px; }
    .masthead .full { min-width: 44px; min-height: 44px; margin: -12px -8px -12px 0; border: 0; background: none; color: var(--hint); font: 20px/1 var(--sans); cursor: pointer; border-radius: 10px; }
    .masthead .full:hover { color: var(--fg); background: var(--card); }
    nav { display: flex; gap: 6px; padding: 6px 16px 10px; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav button { flex: 0 0 auto; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 22px;
      background: var(--card); color: var(--fg); font-size: 14px; }
    nav button[aria-current="page"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    main { padding: 16px 16px 112px; max-width: 640px; margin: 0 auto; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 16px calc(6px + env(safe-area-inset-bottom));
      display: flex; justify-content: space-between; font: 11px/1 var(--mono); color: var(--hint);
      background: linear-gradient(to top, var(--bg) 70%, transparent); pointer-events: none; }

    /* ── type & blocks ── */
    h2 { margin: 0 0 4px; font: 600 26px/1.15 var(--serif); letter-spacing: -0.015em; }
    h3 { margin: 22px 0 8px; font: 600 15px/1.2 var(--sans); color: var(--hint); letter-spacing: 0.04em; text-transform: uppercase; }
    h3.round { margin-top: 28px; padding-top: 12px; border-top: 2px solid var(--fg); color: var(--fg); }
    h4 { margin: 14px 0 6px; font: 600 13px/1.2 var(--sans); color: var(--hint); letter-spacing: 0.04em; text-transform: uppercase; }
    .lede { margin: 0 0 16px; color: var(--hint); font-size: 15px; }
    .meta { font: 12px/1.4 var(--mono); color: var(--hint); }
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 0 0 10px; }
    .card.flat { background: transparent; border: 1px solid var(--line); }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .note { border-left: 3px solid var(--accent); padding: 8px 12px; margin: 8px 0; background: var(--card); border-radius: 0 10px 10px 0; }
    .state { text-align: center; padding: 48px 20px; color: var(--hint); }
    .state h2 { color: var(--fg); }
    .state .big { font-size: 40px; margin-bottom: 10px; }
    .pill { display: inline-block; font: 11px/1 var(--mono); padding: 5px 8px; border-radius: 10px; background: var(--section); border: 1px solid var(--line); color: var(--hint); margin: 0 6px 6px 0; }
    .pill.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    button.pill { min-height: 44px; min-width: 44px; padding: 0 12px; margin: 0; font-size: 12px; }
    .btn { min-height: 44px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--btn); color: var(--btn-fg); font-weight: 600; }
    .btn.ghost { background: var(--card); color: var(--fg); }
    .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
    .btn.wide { width: 100%; margin-top: 10px; }
    .stack > * + * { margin-top: 10px; }
    .count { font: 600 36px/1 var(--serif); }
    .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .counts .card { margin: 0; text-align: center; }
    input[type=text], input[type=search], textarea, select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--section); }
    textarea { min-height: 72px; resize: vertical; }
    label.q { display: block; font-weight: 600; margin: 18px 0 8px; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choices button { min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--section); }
    .choices button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .sec-count { margin-left: 8px; font: 12px/1 var(--mono); letter-spacing: 0; color: var(--hint); }
    #who { margin-bottom: 14px; }
    .note .btn { flex: 0 0 auto; white-space: nowrap; }

    /* ── shortlist (the checklist) ── */
    .item { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .item .n { font: 600 18px/1.3 var(--serif); color: var(--hint); }
    .item .name { font-weight: 600; }
    .item .why { color: var(--hint); font-size: 14px; margin: 2px 0 6px; }
    .item.gem .name::after { content: " 💎"; }
    .ticks { display: flex; gap: 6px; }
    .ticks button { flex: 1 1 0; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--section); font-size: 14px; }
    .ticks button[aria-pressed="true"][data-v="w"] { background: var(--want); color: #fff; border-color: var(--want); }
    .ticks button[aria-pressed="true"][data-v="l"] { background: var(--later); color: #fff; border-color: var(--later); }
    .ticks button[aria-pressed="true"][data-v="s"] { background: var(--skip); color: #fff; border-color: var(--skip); }
    .actions { display: flex; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .actions button { flex: 1 1 0; }

    /* ── brochure ── */
    .frame { width: 100%; height: calc(var(--vh) - 180px); min-height: 360px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .days button { flex: 0 0 auto; min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }
    .pdf-row { margin: 0 0 14px; flex-wrap: wrap; }

    /* ── veg card: full screen, the local text large enough to hand the phone to the staff (C14) ── */
    .vc-full { position: fixed; inset: 0; z-index: 10; overflow-y: auto; background: var(--bg); color: var(--fg);
      padding: calc(14px + var(--safe-top, 0px)) 18px calc(28px + env(safe-area-inset-bottom)); }
    .vc-full .vc-in { max-width: 640px; margin: 0 auto; }
    .vc-bar { gap: 8px; margin-bottom: 12px; }
    .vc-head { font: 600 20px/1.2 var(--serif); margin: 4px 0 2px; }
    .vc-sec { border-top: 1px solid var(--line); padding: 10px 0 4px; }
    .vc-line { margin: 0 0 12px; overflow-wrap: anywhere; }
    .vc-local { display: block; font: 600 26px/1.35 var(--serif); }
    .vc-en { display: block; font-size: 15px; color: var(--hint); margin-top: 2px; }
    .vc-line.only .vc-en { font: 600 22px/1.35 var(--serif); color: var(--fg); }
    .vc-full.hide-en .vc-line:not(.only) .vc-en { display: none; }
    .vc-eo li { font: 600 20px/1.4 var(--serif); overflow-wrap: anywhere; }

    /* ── places ── */
    .filters { display: flex; gap: 6px; margin: 8px 0 12px; }
    .filters select { min-width: 0; flex: 1 1 0; font-size: 14px; }
    .place-actions { gap: 6px; }
    .place-actions button { min-height: 44px; min-width: 44px; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--section); font-size: 16px; }
    .place-actions button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

    /* ── a planned day (reads like the chat's day card) ── */
    .stop { margin-top: 8px; }
    .stop .name a, .line a, .leg a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    .leg { font: 12px/1.45 var(--mono); color: var(--hint); margin: 6px 0 0 14px; overflow-wrap: anywhere; }
    .sub { font-size: 14px; font-style: italic; color: var(--hint); margin: 2px 0 0 14px; overflow-wrap: anywhere; }
    .line { margin-top: 8px; overflow-wrap: anywhere; }
    .card h4 { margin-top: 12px; }

    /* ── compare: outlines as columns, a row per day; versions of each day ── */
    .opt { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 8px; background: var(--section); }
    .opt .gain, .opt .give { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
    .cmp { display: grid; gap: 4px; margin: 10px 0 6px; align-items: stretch; }
    .cmp .hd { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--section); font: 600 15px/1.1 var(--serif); padding: 4px 2px; }
    .cmp .hd[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .cmp .dt { font: 11px/1.25 var(--mono); color: var(--hint); padding: 8px 0 0; overflow-wrap: anywhere; }
    .cmp .dt b { display: block; font: 600 16px/1 var(--serif); color: var(--fg); margin-bottom: 2px; }
    .cmp .cell { min-height: 64px; min-width: 0; text-align: left; padding: 6px 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--section);
      font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; word-break: break-word; }
    .cmp .cell .k { display: block; font: 10px/1.2 var(--mono); color: var(--hint); margin-bottom: 3px; letter-spacing: 0.02em; }
    .cmp .cell .a { display: block; font-weight: 600; }
    .cmp .cell .an { display: block; font-size: 12px; color: var(--hint); margin-top: 2px; }
    .cmp .cell[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .cmp .cell[aria-pressed="true"] .k, .cmp .cell[aria-pressed="true"] .an { color: inherit; opacity: 0.8; }
    .cmp .cell.mixed { box-shadow: 0 0 0 2px var(--accent); }
    .legend { font: 11px/1.4 var(--mono); color: var(--hint); margin: 0 0 4px; }
    .ver { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: var(--section); }
    .ver.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
    .ver .stops { font-size: 14px; margin: 6px 0 4px; overflow-wrap: anywhere; }
    .ver .sum { font-size: 14px; color: var(--hint); margin-top: 2px; }
    .ver .meta { overflow-wrap: anywhere; margin-top: 3px; }
    .ver .note { font-size: 14px; }

    /* ── commands: every command the bot answers, grouped; a form copies on tap ── */
    .cmd { padding: 12px 0; border-bottom: 1px solid var(--line); }
    .cmd .cname { font: 600 17px/1.2 var(--mono); }
    .cmd .does { margin: 4px 0 6px; font-size: 15px; overflow-wrap: anywhere; }
    .form { display: flex; flex-direction: column; align-items: flex-start; width: 100%; min-height: 44px; margin-top: 6px; padding: 8px 12px; text-align: left;
      border: 1px solid var(--line); border-radius: 10px; background: var(--section); cursor: pointer; }
    .form .ftext { font: 13px/1.35 var(--mono); overflow-wrap: anywhere; }
    .form .fmeans { font-size: 13px; color: var(--hint); margin-top: 2px; }
    .form.copied { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
    .group-about { margin: -4px 0 4px; font-size: 14px; color: var(--hint); }

    .reveal { animation: rise 0.35s ease both; }
    .reveal:nth-child(2) { animation-delay: 0.04s; } .reveal:nth-child(3) { animation-delay: 0.08s; }
    .reveal:nth-child(4) { animation-delay: 0.12s; } .reveal:nth-child(5) { animation-delay: 0.16s; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
  </style>

    }
    /**
     * The day view's 🍽 under the dinner (C16): a dinner whose note carries a menu caveat asks menu.day in the background;
     * "🍽 Menu: <fits>" opens the check, "🍽 Check the menu" asks for one. Nothing shows when the helper offers no button
     * or does not answer: the day itself never waits for it.
     */
    function menuDaySlot(trip, d, dinner) {
      var date = str(obj(d).date, 10), slug = str(dinner.slug, 64), slot = el('div', { class: 'row', 'data-menu': date });
      if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !MENU_CAVEAT_RE.test(str(dinner.note_line))) return null;
      api('menu.day', { trip: trip, date: date }, function (err, body) {
        var b = !err && body && body.ok && body.button ? obj(body.button) : null;
        if (!b) return;
        var check = MENU_ID_RE.test(str(b.check, 64)) ? str(b.check, 64) : '';
        slot.appendChild(el('button', { class: 'pill', type: 'button', text: check ? '🍽 Menu: ' + (MENU_FITS_WORD[str(b.fits, 10)] || 'open the check') : '🍽 Check the menu', on: { click: function (ev) {
          if (check) { S.menu = check; go('menu'); return; }
          var btn = ev.currentTarget; btn.disabled = true;
          call('menu.new', { place: str(dinner.name, 80), slug: slug, date: date }, function (r) { haptic('ok'); btn.textContent = '🍽 Reading the menu…'; setStatus(menuAsked(r)); },
            function (e2) { btn.disabled = false; setStatus('Not asked: ' + menuWhy(e2)); });
        } } }));
      });
      return slot;
    }

    /* ---------- commands: what the bot answers, from the helper's own registry (commands.list); a form copies on tap ---------- */
    function copyText(t, done) {
      var fallback = function () {
        var ok = false;
        try { var ta = el('textarea', { readonly: 'readonly', style: 'position:fixed;top:-1000px;opacity:0' }); ta.value = t; document.body.appendChild(ta); ta.select(); ok = document.execCommand('copy'); document.body.removeChild(ta); } catch (e) { ok = false; }
        done(ok);
      };
      try { if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(t).then(function () { done(true); }, fallback); return; } } catch (e) { /* no clipboard API */ }
      fallback();
    }
    // Each query word must start the command's name or be a whole word of its description or examples ("date" finds "dates",
    // "late" does not find "later").
    function cmdMatches(c, q) {
      if (!q) return true;
      var name = str(c.cmd).toLowerCase().replace(/^\//, ''), words = {};
      [c.does].concat(list(c.forms).map(function (f) { f = obj(f); return str(f.text) + ' ' + str(f.means); })).join(' ').toLowerCase()
        .split(/[^a-z0-9\u00c0-\uffff]+/).forEach(function (w) { if (w) words[w] = true; });
      return q.split(/\s+/).every(function (w) {
        w = w.replace(/^\//, '');
        return !w || name.indexOf(w) === 0 || words[w] || words[w + 's'] || words[w + 'es'] || (/s$/.test(w) && words[w.replace(/e?s$/, '')]);
      });
    }
    function cmdForm(f) {
      f = obj(f); var text = str(f.text, 200), means = str(f.means, 120);
      return el('button', { class: 'form', type: 'button', 'data-form': text, on: { click: function (ev) {
        var b = ev.currentTarget;
        copyText(text, function (ok) {
          if (ok) { haptic('ok'); b.classList.add('copied'); setTimeout(function () { b.classList.remove('copied'); }, 1200); setStatus('Copied ' + str(text, 60) + ' — paste it in the chat.'); }
          else setStatus('Copy is not available here — type ' + str(text, 60) + ' in the chat.');
        });
      } } }, [el('span', { class: 'ftext', text: text }), means ? el('span', { class: 'fmeans', text: means }) : null]);
    }
    function cmdList(box, data, q) {
      clear(box); var n = 0;
      list(data.groups).map(obj).forEach(function (g) {
        var rows = list(g.commands).map(obj).filter(function (c) { return /^\/[a-z0-9_]{1,31}$/.test(str(c.cmd, 40)) && cmdMatches(c, q); });
        if (!rows.length) return;
        box.appendChild(el('h3', { text: str(g.title, 60) }));
        if (g.about) box.appendChild(el('p', { class: 'group-about', text: str(g.about, 200) }));
        rows.forEach(function (c) {
          n++;
          box.appendChild(el('div', { class: 'cmd', 'data-cmd': str(c.cmd, 40) }, [el('div', { class: 'cname', text: str(c.cmd, 40) }),
            c.does ? el('div', { class: 'does', text: str(c.does, 400) }) : null].concat(list(c.forms).slice(0, 6).map(cmdForm))));
        });
      });
      if (!n) { box.appendChild(el('p', { class: 'meta', text: 'No command matches “' + str(q, 60) + '”.' })); return; }
      var tips = list(data.tips).map(obj).filter(function (t) { return t.title && t.text; });
      if (q || !tips.length) return;
      box.appendChild(el('h3', { text: 'Without a command' }));
      tips.slice(0, 8).forEach(function (t) { box.appendChild(el('div', { class: 'note' }, [el('b', { text: str(t.title, 60) + '. ' }), str(t.text, 300)])); });
    }
    function showCommands() {
      var draw = function (data) {
        var count = Math.max(0, Math.round(num(data.count)));
        var find = el('input', { type: 'search', placeholder: 'Find a command: late, menu, dates…', maxlength: '60', 'aria-label': 'Find a command' });
        var box = el('div', {});
        var view = el('div', {}, [el('h2', { text: 'Commands' }),
          el('p', { class: 'lede', text: 'Everything you can send in the chat' + (count ? ' — ' + count + ' commands' : '') + '. Tap an example to copy it, then paste it in the chat.' }), find, box]);
        find.addEventListener('input', function () { cmdList(box, data, str(find.value, 60).trim().toLowerCase()); });
        cmdList(box, data, '');
        render(view);
      };
      if (S.commands) return draw(S.commands);
      render(stateView('', 'Loading…'));
      call('commands.list', {}, function (b) { S.commands = b; draw(b); },
        function (err) { render(stateView('⌨️', 'Commands not available', why(err) + ' /help in the chat lists them.', homeBtn())); });
    }

    /* ---------- boot ---------- */
    /* ---------- size: full height everywhere, full screen on the web clients ----------
     * expand() gives the full height on every client. On web.telegram.org (k and a) a Mini App is a floating, resizable window
     * that the client opens at one fixed size and that no event can enlarge (web_app_expand is ignored there), and its
     * fullscreen is the browser's own, which a page may only ask for from a tap. So on those clients the masthead carries a
     * ⤢ button: one tap takes the whole window, ⤡ (or Esc) gives it back. The client overlays its close button in that mode
     * and says how tall the overlay is (contentSafeAreaInset.top); the header pads by that much. Phones fill the screen
     * already, and the desktop apps keep their own window, so neither shows the button. */
    function openWide() {
      try { tg.ready(); } catch (e) { /* older clients */ }
      try { if (!tg.isExpanded) tg.expand(); } catch (e) { /* older clients */ }
    }
    function webFull() {
      return !!tg && /^web/.test(str(tg.platform, 20)) && typeof tg.requestFullscreen === 'function' && (!tg.isVersionAtLeast || tg.isVersionAtLeast('8.0'));
    }
    function applyFull() {
      var on = !!(tg && tg.isFullscreen), b = $('full'), label = on ? 'Exit full screen' : 'Full screen';
      b.classList.toggle('hidden', !webFull()); b.textContent = on ? '\u2921' : '\u2922'; b.setAttribute('aria-label', label); b.title = label;
      var inset = tg && tg.contentSafeAreaInset ? num(tg.contentSafeAreaInset.top) : 0;
      document.documentElement.style.setProperty('--safe-top', Math.max(0, inset) + 'px');
    }
    function toggleFull() {
      try { if (tg.isFullscreen) tg.exitFullscreen(); else tg.requestFullscreen(); } catch (e) { setStatus('Full screen is not available here.'); }
    }
    function boot() {
      $('appVer').textContent = APP_VERSION;
      try { fetch('html-versions/helper-apphtml.version.txt', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) { var v = (t.split('|')[1] || '').trim(); if (v) $('appVer').textContent = v; }).catch(function () {}); } catch (e) { /* offline */ }
      if (!tg || !tg.initData) { render(stateView('🤖', 'Open this from your helper\'s bot', 'This page only works inside Telegram, launched by the bot that owns it.')); return; }
      openWide();
      applyTheme(); applyViewport();
      try { tg.onEvent('themeChanged', applyTheme); tg.onEvent('viewportChanged', applyViewport); } catch (e) { /* older clients */ }
      $('full').addEventListener('click', toggleFull); applyFull();
      try { tg.onEvent('fullscreenChanged', applyFull); tg.onEvent('contentSafeAreaChanged', applyFull); tg.onEvent('fullscreenFailed', function () { applyFull(); setStatus('Full screen is not available here.'); }); } catch (e) { /* older clients */ }
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushDraft(); }); window.addEventListener('pagehide', flushDraft);
      try { if (tg.MainButton) tg.MainButton.onClick(function () { if (mainBtn.fn && !S.busy) mainBtn.fn(); }); if (tg.BackButton) tg.BackButton.onClick(function () { go('home'); }); } catch (e) { /* older clients */ }
      var fromUrl = readParams();
      resolveCore(fromUrl, function () {
        if (!S.core) { render(stateView('🔗', 'No helper address', 'Open the app from the bot\'s menu button or one of its buttons — the link carries the address.')); return; }
        $('chrome').classList.remove('hidden'); buildNav(); go(S.screen);
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();

  </script>
