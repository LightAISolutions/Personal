<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline' https://telegram.org; connect-src 'self' https://script.google.com https://script.googleusercontent.com; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src 'self' blob:; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex">
  <meta name="build-version" content="v01.07w">
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <title>Helper app</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
/*
 * A generic Telegram Mini App shell for a helper built on the helpers framework (helpers/SPEC.md §6, "Registered
 * routes"). It carries no data, no key and no helper-specific text: the core named by ?core= serves everything after
 * verifying Telegram's signed launch data. Editorial-journal tone: a serif voice for headings, a quiet mono for facts,
 * the chat's own theme colours for everything else so the app reads as part of the conversation it came from.
 */
    :root {
      --bg: #ffffff; --fg: #1a1a1a; --hint: #6f6f6f; --link: #2a6fb0; --btn: #2a6fb0; --btn-fg: #ffffff;
      --card: #f4f3ef; --section: #ffffff; --accent: #2a6fb0; --danger: #c0392b; --line: rgba(0,0,0,0.09);
      --want: #2e7d32; --later: #b26a00; --skip: #8e8e8e; --vh: 100vh;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
    body { font: 16px/1.45 var(--sans); min-height: var(--vh); overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    button, input, select, textarea { font: inherit; color: inherit; }
    a { color: var(--link); }
    .hidden { display: none !important; }

    /* ── chrome ── */
    header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
    .masthead { display: flex; align-items: baseline; justify-content: space-between; padding: 14px 16px 6px; }
    .masthead h1 { margin: 0; font: 600 22px/1.1 var(--serif); letter-spacing: -0.01em; }
    .masthead .kicker { font: 11px/1 var(--mono); color: var(--hint); letter-spacing: 0.08em; text-transform: uppercase; }
    nav { display: flex; gap: 6px; padding: 6px 16px 10px; overflow-x: auto; scrollbar-width: none; }
    nav::-webkit-scrollbar { display: none; }
    nav button { flex: 0 0 auto; min-height: 44px; padding: 0 14px; border: 1px solid var(--line); border-radius: 22px;
      background: var(--card); color: var(--fg); font-size: 14px; }
    nav button[aria-current="page"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    main { padding: 16px 16px 112px; max-width: 640px; margin: 0 auto; }
    footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 6px 16px calc(6px + env(safe-area-inset-bottom));
      display: flex; justify-content: space-between; font: 11px/1 var(--mono); color: var(--hint);
      background: linear-gradient(to top, var(--bg) 70%, transparent); pointer-events: none; }

    /* ── type & blocks ── */
    h2 { margin: 0 0 4px; font: 600 26px/1.15 var(--serif); letter-spacing: -0.015em; }
    h3 { margin: 22px 0 8px; font: 600 15px/1.2 var(--sans); color: var(--hint); letter-spacing: 0.04em; text-transform: uppercase; }
    h3.round { margin-top: 28px; padding-top: 12px; border-top: 2px solid var(--fg); color: var(--fg); }
    h4 { margin: 14px 0 6px; font: 600 13px/1.2 var(--sans); color: var(--hint); letter-spacing: 0.04em; text-transform: uppercase; }
    .lede { margin: 0 0 16px; color: var(--hint); font-size: 15px; }
    .meta { font: 12px/1.4 var(--mono); color: var(--hint); }
    .card { background: var(--card); border-radius: 14px; padding: 14px; margin: 0 0 10px; }
    .card.flat { background: transparent; border: 1px solid var(--line); }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .grow { flex: 1 1 auto; min-width: 0; }
    .note { border-left: 3px solid var(--accent); padding: 8px 12px; margin: 8px 0; background: var(--card); border-radius: 0 10px 10px 0; }
    .state { text-align: center; padding: 48px 20px; color: var(--hint); }
    .state h2 { color: var(--fg); }
    .state .big { font-size: 40px; margin-bottom: 10px; }
    .pill { display: inline-block; font: 11px/1 var(--mono); padding: 5px 8px; border-radius: 10px; background: var(--section); border: 1px solid var(--line); color: var(--hint); margin: 0 6px 6px 0; }
    .pill.on { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    button.pill { min-height: 44px; min-width: 44px; padding: 0 12px; margin: 0; font-size: 12px; }
    .btn { min-height: 44px; padding: 10px 16px; border: 0; border-radius: 12px; background: var(--btn); color: var(--btn-fg); font-weight: 600; }
    .btn.ghost { background: var(--card); color: var(--fg); }
    .btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
    .btn.wide { width: 100%; margin-top: 10px; }
    .stack > * + * { margin-top: 10px; }
    .count { font: 600 36px/1 var(--serif); }
    .counts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .counts .card { margin: 0; text-align: center; }
    input[type=text], input[type=search], textarea, select { width: 100%; min-height: 44px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--section); }
    textarea { min-height: 72px; resize: vertical; }
    label.q { display: block; font-weight: 600; margin: 18px 0 8px; }
    .choices { display: flex; flex-wrap: wrap; gap: 8px; }
    .choices button { min-height: 44px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--section); }
    .choices button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .sec-count { margin-left: 8px; font: 12px/1 var(--mono); letter-spacing: 0; color: var(--hint); }
    #who { margin-bottom: 14px; }
    .note .btn { flex: 0 0 auto; white-space: nowrap; }

    /* ── shortlist (the checklist) ── */
    .item { display: grid; grid-template-columns: 34px 1fr; gap: 10px; padding: 12px 0; border-bottom: 1px solid var(--line); }
    .item .n { font: 600 18px/1.3 var(--serif); color: var(--hint); }
    .item .name { font-weight: 600; }
    .item .why { color: var(--hint); font-size: 14px; margin: 2px 0 6px; }
    .item.gem .name::after { content: " 💎"; }
    .ticks { display: flex; gap: 6px; }
    .ticks button { flex: 1 1 0; min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--section); font-size: 14px; }
    .ticks button[aria-pressed="true"][data-v="w"] { background: var(--want); color: #fff; border-color: var(--want); }
    .ticks button[aria-pressed="true"][data-v="l"] { background: var(--later); color: #fff; border-color: var(--later); }
    .ticks button[aria-pressed="true"][data-v="s"] { background: var(--skip); color: #fff; border-color: var(--skip); }
    .actions { display: flex; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    .actions button { flex: 1 1 0; }

    /* ── brochure ── */
    .frame { width: 100%; height: calc(var(--vh) - 180px); min-height: 360px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .days button { flex: 0 0 auto; min-width: 44px; min-height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); }

    /* ── places ── */
    .filters { display: flex; gap: 6px; margin: 8px 0 12px; }
    .filters select { min-width: 0; flex: 1 1 0; font-size: 14px; }
    .place-actions { gap: 6px; }
    .place-actions button { min-height: 44px; min-width: 44px; padding: 0; border-radius: 10px; border: 1px solid var(--line); background: var(--section); font-size: 16px; }
    .place-actions button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }

    /* ── a planned day (reads like the chat's day card) ── */
    .stop { margin-top: 8px; }
    .stop .name a, .line a, .leg a { color: inherit; text-decoration: underline; text-decoration-color: var(--line); text-underline-offset: 3px; }
    .leg { font: 12px/1.45 var(--mono); color: var(--hint); margin: 6px 0 0 14px; overflow-wrap: anywhere; }
    .sub { font-size: 14px; font-style: italic; color: var(--hint); margin: 2px 0 0 14px; overflow-wrap: anywhere; }
    .line { margin-top: 8px; overflow-wrap: anywhere; }
    .card h4 { margin-top: 12px; }

    /* ── compare: outlines as columns, a row per day; versions of each day ── */
    .opt { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin: 0 0 8px; background: var(--section); }
    .opt .gain, .opt .give { font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
    .cmp { display: grid; gap: 4px; margin: 10px 0 6px; align-items: stretch; }
    .cmp .hd { min-height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--section); font: 600 15px/1.1 var(--serif); padding: 4px 2px; }
    .cmp .hd[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .cmp .dt { font: 11px/1.25 var(--mono); color: var(--hint); padding: 8px 0 0; overflow-wrap: anywhere; }
    .cmp .dt b { display: block; font: 600 16px/1 var(--serif); color: var(--fg); margin-bottom: 2px; }
    .cmp .cell { min-height: 64px; min-width: 0; text-align: left; padding: 6px 7px; border-radius: 10px; border: 1px solid var(--line); background: var(--section);
      font-size: 13px; line-height: 1.25; overflow-wrap: anywhere; word-break: break-word; }
    .cmp .cell .k { display: block; font: 10px/1.2 var(--mono); color: var(--hint); margin-bottom: 3px; letter-spacing: 0.02em; }
    .cmp .cell .a { display: block; font-weight: 600; }
    .cmp .cell .an { display: block; font-size: 12px; color: var(--hint); margin-top: 2px; }
    .cmp .cell[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
    .cmp .cell[aria-pressed="true"] .k, .cmp .cell[aria-pressed="true"] .an { color: inherit; opacity: 0.8; }
    .cmp .cell.mixed { box-shadow: 0 0 0 2px var(--accent); }
    .legend { font: 11px/1.4 var(--mono); color: var(--hint); margin: 0 0 4px; }
    .ver { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; margin-top: 8px; background: var(--section); }
    .ver.on { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
    .ver .stops { font-size: 14px; margin: 6px 0 4px; overflow-wrap: anywhere; }
    .ver .sum { font-size: 14px; color: var(--hint); margin-top: 2px; }
    .ver .meta { overflow-wrap: anywhere; margin-top: 3px; }
    .ver .note { font-size: 14px; }

    .reveal { animation: rise 0.35s ease both; }
    .reveal:nth-child(2) { animation-delay: 0.04s; } .reveal:nth-child(3) { animation-delay: 0.08s; }
    .reveal:nth-child(4) { animation-delay: 0.12s; } .reveal:nth-child(5) { animation-delay: 0.16s; }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
  </style>

<body>
  <header id="chrome" class="hidden">
    <div class="masthead"><h1 id="title">Helper</h1><span class="kicker" id="kicker"></span></div>
    <nav id="nav" aria-label="Screens"></nav>
  </header>
  <main id="main"></main>
  <footer><span id="status"></span><span id="appVer"></span></footer>
  <script>

  (function () {

      { id: 'home', label: 'Home' }, { id: 'shortlist', label: 'Shortlist' }, { id: 'compare', label: 'Compare' }, { id: 'facts', label: 'Facts' },
      { id: 'interview', label: 'Interview' }, { id: 'brochure', label: 'Brochure' }, { id: 'places', label: 'Places' },
      { id: 'scout', label: 'Scout' }

    var tg = (window.Telegram && window.Telegram.WebApp) || null;
    var S = { core: '', screen: 'home', trip: '', home: null, shortlist: null, ticks: {}, places: null, bank: null, answers: {}, typed: {}, facts: null, factChoices: {}, factEdits: {}, person: '', scout: '', jy: null, base: '', mix: {}, busy: false };

    }
    function homeBtn() { return el('button', { class: 'btn', type: 'button', text: 'Back home', on: { click: function () { go('home'); } } }); }
    /* A refusal in plain words: the reason the helper sent, plus what the chat is doing when it says which stage it is at. */
    var WHY = { no_flow: 'Nothing is open for this in the chat right now.', busy: 'The chat is busy with another step — finish it there first.', no_round: 'There is no open shortlist.',
      no_picks: 'Tick ✅ on at least one place first.', no_more: 'No more rounds for this shortlist.', no_trip: 'That trip is not on file.', bad_answer: 'The helper sent an answer the app could not read.',

      no_board: 'This scout has no board file.', too_long: 'Please keep it under 80 characters.', missing_arg: 'Something is missing — fill it in and try again.',

      no_outline: 'That outline is gone — a newer one may have come in.', no_versions: 'No versions of that day yet.', no_day: 'That day is not part of the trip.',
      stale: 'That list was replaced by a newer one.', not_planned: 'That day is not planned yet — choose a version, then build the plan.',

                   : { bg: '#ffffff', fg: '#1a1a1a', hint: '#6f6f6f', link: '#2a6fb0', btn: '#2a6fb0', btnfg: '#ffffff', card: '#f4f3ef', section: '#ffffff', line: 'rgba(0,0,0,0.09)' };

      r.setProperty('--accent', c('accent_text_color', c('link_color', d.link))); r.setProperty('--danger', c('destructive_text_color', '#c0392b'));

        call('places.check', { slugs: slugs }, function () { mainProgress(false); haptic('ok'); picked = {}; setMain('', null); setStatus('Check requested — the answer comes in the chat'); search(); }, function (err) { mainProgress(false); setStatus('Not requested: ' + str(err.reason, 40)); });
      } : null); };
      var showPlace = function (pl) {
        var box = el('div', { class: 'stack' }, [el('h2', { text: str(pl.name, 80) }), el('p', { class: 'lede', text: [str(pl.destination, 40), str(pl.area, 40), str(pl.category, 30)].filter(Boolean).join(' · ') }),
          pl.note_line ? el('div', { class: 'note', text: str(pl.note_line, 400) }) : null, el('div', { class: 'meta', text: [pl.status ? 'status ' + str(pl.status, 20) : '', pl.last_trip ? 'last trip ' + str(pl.last_trip, 40) : '', pl.last_verified ? 'verified ' + str(pl.last_verified, 10) : ''].filter(Boolean).join(' · ') })]);
        list(pl.history).forEach(function (h) { h = obj(h); box.appendChild(el('div', { class: 'card flat' }, [el('div', { class: 'meta', text: [str(h.date, 10), str(h.trip, 40)].filter(Boolean).join(' · ') }), el('div', { text: str(h.text, 600) })])); });
        box.appendChild(el('div', { class: 'row' }, [linkBtn('Map ↗', pl.maps_url, 'btn ghost'), el('button', { class: 'btn', type: 'button', text: 'Back to places', on: { click: function () { go('places'); } } })]));
        render(box); setMain('', null);
      };
      q.addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(search, 350); });
      [selDest, selStatus, selTag].forEach(function (s) { s.addEventListener('change', search); });
      view.appendChild(q); view.appendChild(el('div', { class: 'filters' }, [selDest, selStatus, selTag])); view.appendChild(results);
      render(view); search();
    }

    /* ---------- scout: one food or activity in one place, ranked for you; the board and the picks ---------- */
    var SCOUT_LEFT = { off_topic: 'off topic', diet: 'nothing you can eat', diet_unproven: 'vegetarian not confirmed', low_rating: 'poorly rated', unproven: 'too little evidence',
      closed: 'closed', closed_on_trip: 'closed on your days', too_far: 'too far', duplicate: 'duplicate', other: 'other' };
    var SCOUT_LABELS = { gem: '💎 gem', veg_verified: '🌱 vegetarian', veg_likely: '🌱 likely vegetarian', booking: 'book ahead', queue: 'expect a queue', cash_only: 'cash only',
      chain: 'chain', 'new': 'new', seen_before: 'seen before', far: 'far' };
    var SCOUT_MODES = { WALK: '🚶', TRANSIT: '🚇', DRIVE: '🚗' };
    function scoutTitle(s) { s = obj(s); var q = str(s.query, 80), p = str(s.place_label, 80).split(',')[0].trim(); return (q.charAt(0).toUpperCase() + q.slice(1)) + (p ? ' in ' + p : ''); }
    function scoutsBtn() { return el('button', { class: 'btn ghost', type: 'button', text: 'All scouts', on: { click: function () { S.scout = ''; showScout(); } } }); }
    function showScout() {
      if (S.scout) return showScoutOne(S.scout);
      var view = el('div', {}, [el('h2', { text: 'Scout' }), el('p', { class: 'lede', text: 'One thing in one place, ranked for you — matcha, ramen, a quiet garden.' })]);
      var what = el('input', { type: 'text', placeholder: 'What should I look for?', maxlength: '80', 'aria-label': 'What to look for' });
      var where = el('input', { type: 'text', placeholder: 'Where? Blank = your current trip', maxlength: '80', 'aria-label': 'Where' });
      var msg = el('div', {}), past = el('div', {}, [el('p', { class: 'meta', text: 'Loading your scouts…' })]);
      var ask = function () {
        var q = str(what.value, 80).trim(), w = str(where.value, 80).trim();
        if (!q) { setStatus('Say what to look for first.'); what.focus(); return; }
        var args = { query: q }; if (w) args.where = w;
        mainProgress(true);
        call('scout.new', args, function (r) {
          mainProgress(false); haptic('ok'); what.value = '';
          clear(msg).appendChild(el('div', { class: 'note', text: '🔎 Scouting ' + str(r.query, 80) + ' in ' + str(r.where, 80) + ' — the ranked list arrives in the chat, then here.' }));
        }, function (err) { mainProgress(false); clear(msg).appendChild(el('div', { class: 'note', text: 'Not asked: ' + why(err) })); });
      };
      [what, where].forEach(function (i) { i.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); ask(); } }); });
      view.appendChild(el('div', { class: 'stack' }, [what, where, el('button', { class: 'btn wide', type: 'button', text: '🔎 Scout it', on: { click: ask } }), msg]));
      view.appendChild(past);
      render(view); setMain('Scout it', ask);
      call('scout.list', {}, function (b) {
        clear(past);
        var rows = list(b.scouts).map(obj).filter(function (s) { return SCOUT_ID_RE.test(str(s.id, 64)); });
        if (!rows.length) { past.appendChild(el('p', { class: 'meta', text: 'No scouts yet.' })); return; }
        past.appendChild(el('h3', { text: 'Past scouts' }));
        rows.forEach(function (s) {
          var id = str(s.id, 64), n = num(s.count);
          past.appendChild(el('div', { class: 'card reveal' }, [el('div', { class: 'row between' }, [
            el('div', { class: 'grow' }, [el('div', { class: 'name', text: scoutTitle(s) }), el('div', { class: 'meta', text: [str(s.created_on, 10), n + ' pick' + (n === 1 ? '' : 's'), s.has_board ? 'board' : ''].filter(Boolean).join(' · ') })]),
            el('button', { class: 'btn ghost', type: 'button', text: 'Open', on: { click: function () { S.scout = id; showScoutOne(id); } } })])]));
        });
      }, function (err) { clear(past).appendChild(el('p', { class: 'meta', text: 'Scouts not available (' + why(err) + ').' })); });
    }
    function showScoutOne(id) {
      render(stateView('', 'Loading…')); setMain('', null);
      call('scout.get', { id: id }, function (b) {
        var s = obj(b.scout), items = list(s.items).map(obj), left = list(s.left_out).map(obj), to = s.add_to ? obj(s.add_to) : null;
        var view = el('div', {}, [el('h2', { text: scoutTitle(s) }), el('p', { class: 'lede', text: [str(s.created_on, 10), items.length ? items.length + ' pick' + (items.length === 1 ? '' : 's') + ', ranked for you' : 'nothing worth the trip this time'].filter(Boolean).join(' · ') })]);
        if (s.has_board) {
          var frameBox = el('div', {}, [el('p', { class: 'meta', text: 'Opening the board…' })]);
          view.appendChild(frameBox);
          call('scout.board', { id: id }, function (r) {
            clear(frameBox);
            if (typeof r.html === 'string' && r.html) {
              var fr = el('iframe', { class: 'frame', sandbox: '', title: 'Scout board', referrerpolicy: 'no-referrer' });
              fr.srcdoc = r.html;            // sandbox="" — no scripts, no same-origin, no forms, no navigation
              frameBox.appendChild(fr);
            } else if (httpsUrl(r.link)) {
              frameBox.appendChild(el('div', { class: 'card' }, [el('p', { text: 'The board is too large to show here — open it in Drive.' }), linkBtn('Open the board ↗', r.link, 'btn')]));
            } else frameBox.appendChild(el('p', { class: 'meta', text: 'No board file.' }));
            if (httpsUrl(r.pdf_link)) frameBox.appendChild(el('div', { class: 'row' }, [linkBtn('Board as PDF ↗', r.pdf_link, 'btn ghost')]));
          }, function (err) { clear(frameBox).appendChild(el('p', { class: 'meta', text: 'Board not available (' + why(err) + ').' })); });
        }
        view.appendChild(el('h3', { text: 'Picks' }));
        if (to && items.length) view.appendChild(el('p', { class: 'meta', text: '➕ puts a pick on the Later list of ' + str(to.title, 60) + '.' }));
        items.forEach(function (it) {
          var n = num(it.n), r = obj(it.reach), mode = SCOUT_MODES[str(r.mode, 10)];
          var meta = [str(it.area, 80), mode && r.minutes !== undefined ? mode + ' ' + (r.estimated ? '~' : '') + num(r.minutes) + ' min' : '', str(it.rated, 40)].filter(Boolean).join(' · ');
          var add = to ? el('button', { class: 'pill', type: 'button', text: '➕', 'aria-label': 'Put on the Later list', 'aria-pressed': 'false', on: { click: function (ev) {
            var btn = ev.currentTarget; if (btn.getAttribute('aria-pressed') === 'true') return; btn.disabled = true;
            call('scout.add', { id: id, n: n }, function (rr) { haptic('ok'); btn.disabled = false; btn.textContent = '🔖'; btn.setAttribute('aria-pressed', 'true'); setStatus(str(rr.name, 60) + ' is on the Later list'); },
              function (err) { btn.disabled = false; setStatus('Not added: ' + (str(err.reason, 40) === 'no_trip' ? 'there is no current trip — plan one in the chat first.' : why(err))); });
          } } }) : null;
          view.appendChild(el('div', { class: 'item reveal' }, [el('div', { class: 'n', text: String(n) }), el('div', {}, [
            el('div', { class: 'row between' }, [el('div', { class: 'grow' }, [el('div', { class: 'name', text: str(it.name, 120) }), meta ? el('div', { class: 'meta', text: meta }) : null]),
              el('div', { class: 'row' }, [add, linkBtn('Map ↗', it.maps_url, 'pill')])]),
            el('div', { class: 'why', text: str(it.why_you, 200) }),
            it.try ? el('div', { class: 'meta', text: 'Try: ' + str(it.try, 120) }) : null,
            list(it.labels).length ? el('div', {}, list(it.labels).slice(0, 8).map(function (l) { l = str(l, 20); return el('span', { class: 'pill', text: SCOUT_LABELS[l] || l }); })) : null])]));
        });
        if (left.length) {
          view.appendChild(el('h3', { text: 'Left out' }));
          left.forEach(function (l) { view.appendChild(el('div', { class: 'meta', style: 'padding:4px 0', text: str(l.name, 120) + ' — ' + (SCOUT_LEFT[str(l.reason, 20)] || str(l.reason, 20)) })); });
        }
        view.appendChild(el('div', { class: 'row', style: 'margin-top:16px' }, [scoutsBtn()]));
        render(view);
      }, function (err) { S.scout = ''; render(stateView('🔎', 'Scout not available', why(err), scoutsBtn())); });
    }

    /* ---------- boot ---------- */
    function boot() {
      $('appVer').textContent = APP_VERSION;
      try { fetch('html-versions/helper-apphtml.version.txt', { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) { var v = (t.split('|')[1] || '').trim(); if (v) $('appVer').textContent = v; }).catch(function () {}); } catch (e) { /* offline */ }
      if (!tg || !tg.initData) { render(stateView('🤖', 'Open this from your helper\'s bot', 'This page only works inside Telegram, launched by the bot that owns it.')); return; }
      try { tg.ready(); tg.expand(); } catch (e) { /* older clients */ }
      applyTheme(); applyViewport();
      try { tg.onEvent('themeChanged', applyTheme); tg.onEvent('viewportChanged', applyViewport); } catch (e) { /* older clients */ }
      document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flushDraft(); }); window.addEventListener('pagehide', flushDraft);
      try { if (tg.MainButton) tg.MainButton.onClick(function () { if (mainBtn.fn && !S.busy) mainBtn.fn(); }); if (tg.BackButton) tg.BackButton.onClick(function () { go('home'); }); } catch (e) { /* older clients */ }
      var fromUrl = readParams();
      resolveCore(fromUrl, function () {
        if (!S.core) { render(stateView('🔗', 'No helper address', 'Open the app from the bot\'s menu button or one of its buttons — the link carries the address.')); return; }
        $('chrome').classList.remove('hidden'); buildNav(); go(S.screen);
      });
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  })();

  </script>
